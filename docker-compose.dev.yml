version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: debt_collection_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: debt_collection
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: debt_collection_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: postgres        # переопределяем, чтобы всегда указывал на сервис
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./src:/app/src         # bind-mount исходников для hot-reload
      - /app/node_modules      # анонимный volume, чтобы node_modules из образа не перезаписывался

volumes:
  pgdata:
